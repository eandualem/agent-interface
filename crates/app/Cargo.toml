[package]
name = "tmux-workspaces-app"
description = "Agent Interface: native workspaces for agents and tmux terminals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The benchmark's build script, so the benchmark window can state its build.
build = "../bench/build.rs"

[[bin]]
name = "tmux-workspaces"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
libc.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
uzers.workspace = true
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true
toml.workspace = true
unicode-segmentation.workspace = true
unicode-properties.workspace = true
tmux-workspaces-core = { path = "../core" }
tmux-workspaces-store = { path = "../store" }
tmux-workspaces-roster = { path = "../roster" }
tmux-workspaces-term = { path = "../term" }
tmux-workspaces-tmux = { path = "../tmux" }

[target.'cfg(target_os = "macos")'.dependencies]
# System WebKit embedding for the artifact experiment (MIT OR Apache-2.0).
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
tmux-workspaces-test-support = { path = "../test-support" }

# Benchmark scaffolding, not product UI.
[[example]]
name = "bench-window"
path = "examples/bench-window.rs"
