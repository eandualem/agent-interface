[package]
name = "agent-interface-app"
description = "Agent Interface: native workspaces for agents and tmux terminals"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The benchmark's build script, so the benchmark window can state its build.
build = "../bench/build.rs"

[[bin]]
name = "agent-interface"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
libc.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
uzers.workspace = true
chrono.workspace = true
sha2.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tempfile.workspace = true
uuid.workspace = true
raw-window-handle.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
unicode-segmentation.workspace = true
pulldown-cmark.workspace = true
unicode-properties.workspace = true
agent-interface-core = { path = "../core" }
agent-interface-store = { path = "../store" }
agent-interface-roster = { path = "../roster" }
agent-interface-term = { path = "../term" }
agent-interface-tmux = { path = "../tmux" }

[target.'cfg(target_os = "linux")'.dependencies]
# WebKitGTK embedding and its main loop (MIT).
wry = { version = "=0.57.1", default-features = false, features = ["os-webview", "x11"] }
gtk = "=0.18.2"
gdkx11 = "=0.18.2"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }
# Select GPUI's X11 host, also under Wayland through XWayland (Apache-2.0).
gpui_linux = { package = "gpui-pre-linux", version = "=0.3.9", default-features = false, features = ["x11"] }
agent-interface-webview-host = { path = "../webview-host" }

[target.'cfg(target_os = "macos")'.dependencies]
# System WebKit embedding for the artifact experiment (MIT OR Apache-2.0).
wry = { version = "=0.57.1", default-features = false, features = ["os-webview"] }
# Safe access to the existing native macOS bridge (Apache-2.0).
gpui_macos = { package = "gpui-pre-macos", version = "=0.3.9", default-features = false }

[dev-dependencies]
rusqlite.workspace = true
tempfile.workspace = true
agent-interface-test-support = { path = "../test-support" }

# Benchmark scaffolding, not product UI.
[[example]]
name = "bench-window"
path = "examples/bench-window.rs"
