[package]
name = "tmux-workspaces-bench"
description = "The milestone-0 benchmark harness for tmux-workspaces"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tmux-workspaces-bench"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
alacritty_terminal.workspace = true
libc.workspace = true
tempfile.workspace = true
tmux-workspaces-term = { path = "../term" }
tmux-workspaces-test-support = { path = "../test-support" }
tmux-workspaces-tmux = { path = "../tmux" }

# The display measurements of gates 2 to 4 run on macOS only.
[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-foundation.workspace = true
objc2-screen-capture-kit.workspace = true

[dev-dependencies]
libghostty-vt.workspace = true
