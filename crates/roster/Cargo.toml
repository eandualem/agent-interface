[package]
name = "tmux-workspaces-roster"
description = "Optional agents roster and user feedback for Agent Interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
libc.workspace = true
sha2.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
toml.workspace = true
http.workspace = true
reqwest.workspace = true
# Reuse the HTTP stack with a verified connected Unix peer.
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
tokio = { version = "=1.53.3", features = ["rt", "net", "time"] }
rustix = { workspace = true, features = ["process"] }
rusqlite.workspace = true

[dev-dependencies]
log = "=0.4.34"
tempfile.workspace = true
