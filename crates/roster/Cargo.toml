[package]
name = "agent-interface-roster"
description = "Optional agents roster and user feedback for Agent Interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
sha2.workspace = true
base64.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
# Reuse the HTTP stack with a verified connected Unix peer.
hyper = { version = "=1.12.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
http-body-util = "=0.1.5"
tokio = { version = "=1.53.3", features = ["rt", "net", "time"] }
rustix = { workspace = true, features = ["process"] }
# Compares the service's reported version with the supported minimum.
semver = "=1.0.28"
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
