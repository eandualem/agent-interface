rename-tab = ["r"]
tab-options = ["m"]
next-tab = ["n"]
previous-tab = ["p"]
next-pane = ["o"]
previous-pane = ["O"]
focus = ["z"]
workspaces = ["w"]
workspace-options = ["M"]
new-workspace = ["W"]
rename-workspace = ["R"]
next-workspace = ["]"]
previous-workspace = ["["]
close-pane = ["x"]
close-tab = ["&"]
copy-selection = ["y"]
sidebar = ["s"]
refresh-viewer = ["f"]
