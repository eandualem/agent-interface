tab-options = []
next-tab = ["super+shift+bracket_right"]
previous-tab = ["super+shift+bracket_left"]
next-pane = ["super+bracket_right"]
previous-pane = ["super+bracket_left"]
focus = ["super+shift+enter"]
workspaces = []
workspace-options = []
new-workspace = ["super+shift+n"]
rename-workspace = ["super+shift+r"]
next-workspace = ["super+alt+right"]
previous-workspace = ["super+alt+left"]
close-pane = ["super+w"]
close-tab = ["super+shift+w"]
