# Build downloadable native packages for inspection; this does not publish a release.
name: Native packages
on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: Upload the built archives and checksums
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, MIT
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install
          rustup component add rust-docs
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1, MIT
        with:
          version: 0.15.2
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22, Apache-2.0 OR MIT
        if: runner.os != 'macOS' || runner.arch != 'X64'
        with:
          tool: cargo-about@0.9.2
      - name: Build notice generator (Intel macOS)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: cargo install cargo-about --version 0.9.2 --locked --features cli
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y pkg-config binutils
          libfontconfig-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
          libx11-xcb-dev libwebkit2gtk-4.1-dev desktop-file-utils
      - name: Installer tests
        run: python3 -B -m unittest discover -s scripts/tests -v
      - name: Package optimized native app
        run: python3 scripts/package.py
      - name: Upload archives and checksums for inspection
        if: inputs.upload_artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0, MIT
        with:
          name: agent-interface-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
  attest:
    # A separate job signs build provenance, so the build and its scripts never
    # receive the signing token.
    if: inputs.upload_artifacts
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Signs build provenance with GitHub's OIDC identity.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, MIT
        with:
          pattern: agent-interface-*
          path: dist
          merge-multiple: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2, MIT
        with:
          subject-path: dist/*.tar.gz
