# The crates and the dependencies each may use are set out in
# docs/ARCHITECTURE.md; deny.toml enforces the
# direction between them.
[workspace]
resolver = "3"
exclude = ["native/gpui-macos", "native/glib", "native/wry"]
members = [
    "crates/core",
    "crates/store",
    "crates/tmux",
    "crates/term",
    "crates/roster",
    "crates/app",
    "crates/webview-host",
    "crates/test-support",
    "crates/bench",
    "crates/bench-rio",
]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/eandualem/agent-interface"
publish = false

[workspace.dependencies]
# The benchmark's comparison engines, pinned exactly like the engine they are
# compared with. rio-vt's default feature adds a
# pseudo-terminal driver the benchmark does not use.
alacritty_terminal = "=0.26.0"
futures = "0.3.34"
# The UI framework, one package family pinned exactly. Its Metal shaders are compiled when the window opens, so building
# on macOS needs only the Command Line Tools, not Xcode.
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
rio-vt = { version = "=0.5.28", default-features = false }
libc = "0.2.191"
memchr = "2.8.3"
# Exact pins: the terminal engine's API is explicitly unstable, and the -sys
# crate fixes the Ghostty source commit and the Zig version.
libghostty-vt = "=0.2.2"
libghostty-vt-sys = "=0.2.2"
# macOS bindings for the display measurements of gates 2 to 4: ScreenCaptureKit,
# Core Graphics window lists and key events, Core Media and Core Video. They
# are the versions GPUI's macOS backend uses, so they add no second copies.
block2 = "0.6.2"
dispatch2 = { version = "0.3.1", default-features = false, features = ["std", "block2", "objc2"] }
objc2 = "0.6.5"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFDictionary", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "libc", "objc2", "CGDirectDisplay", "CGDisplayConfiguration", "CGError", "CGEvent", "CGEventTypes", "CGRemoteOperation", "CGSession", "CGWindow", "CGWindowLevel"] }
objc2-core-media = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-core-video", "CMSampleBuffer", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "objc2", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString", "NSValue"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "dispatch2", "libc", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "SCShareableContent", "SCStream"] }
# Lets the private tmux servers of tests and benchmarks be stopped on an
# interrupt. alacritty_terminal already uses it.
signal-hook = "0.4.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
# Read-only schema-v2 library access.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = "=1.0.229"
toml = "=0.8.23"
serde_json = { version = "=1.0.154", features = ["raw_value", "arbitrary_precision"] }
unicode-segmentation = "=1.13.3"
rustix = { version = "=1.1.5", features = ["fs"] }
unicode-properties = { version = "=0.1.4", default-features = false, features = ["general-category"] }
# Full Unicode case folding for attachment filters.
caseless = "=0.2.2"
uzers = { version = "=0.12.2", default-features = false }
# Local calendar days and times for records and messages. GPUI already builds
# this version with the same feature, so it adds no new package.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
sha2 = "=0.10.9"
http = "=1.5.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking"] }
# Structured local diagnostics; filtering and file I/O belong to the app.
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["std", "fmt", "json", "registry"] }
tracing-appender = "=0.2.5"

uuid = { version = "=1.28.0", features = ["v4"] }
# Window handle traits a platform wrapper must forward. GPUI already builds
# this version, so it adds no package.
raw-window-handle = "=0.6.2"

[workspace.lints.rust]
missing_docs = "warn"

# Native focus queries must reach the content-view accessibility adapter.
[patch.crates-io]
# GTK3 requires GLib 0.18; backport the upstream VariantStrIter soundness fix.
glib = { path = "native/glib" }
# Enable WebKitGTK process isolation before constructing any web view.
wry = { path = "native/wry" }
gpui-pre-macos = { path = "native/gpui-macos" }
